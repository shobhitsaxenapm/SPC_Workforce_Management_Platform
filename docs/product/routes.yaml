routes:
  - path: "/login"
    module: "Authentication"
    roles:
      - "company_admin"
      - "hr"
    public: true
    page: "LoginLanding"
    requirement_ids:
      - "AUTH-001"

  - path: "/login/spc-management"
    module: "Authentication"
    roles:
      - "company_admin"
      - "hr"
    public: true
    page: "SPCManagementLogin"
    requirement_ids:
      - "AUTH-001"

  - path: "/dashboard"
    module: "Dashboard"
    roles:
      - "company_admin"
      - "hr"
    public: false
    page: "Dashboard Overview"
    requirement_ids:
      - "NAV-001"
      - "DASH-001"

  - path: "/candidates"
    module: "Candidates"
    roles:
      - "company_admin"
      - "hr"
    public: false
    page: "Candidate Database"
    requirement_ids:
      - "CAN-001"

  - path: "/approvals/pending"
    module: "Pending Approvals"
    roles:
      - "company_admin"
    public: false
    page: "Approvals Review"
    requirement_ids:
      - "APR-001"

  - path: "/departments"
    module: "Departments"
    roles:
      - "company_admin"
    public: false
    page: "Departments Administration"
    requirement_ids:
      - "DEP-001"

  - path: "/hr-management"
    module: "HR Management"
    roles:
      - "company_admin"
    public: false
    page: "HR Directory"
